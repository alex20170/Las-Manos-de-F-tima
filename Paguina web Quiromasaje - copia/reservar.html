    </header>

    <section class="section">
        <div class="container">
            <h2 style="text-align:center; margin-bottom:40px;">Tu Cita</h2>
            <div class="booking-container">
                <form id="bookingForm" class="booking-form-premium">
                    <div class="form-group">
                        <label>Servicio *</label>
                        <select id="servicio" required>
                            <option value="Masaje Relajante - 60min - 35€">Masaje Relajante (60 min) - 35€</option>
                            <option value="Masaje Terapéutico - 75min - 45€">Masaje Terapéutico (75 min) - 45€</option>
                            <option value="Sesión de Reiki - 60min - 30€">Sesión de Reiki (60 min) - 30€</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Fecha *</label><input type="date" id="fecha" required></div>
                    <div class="form-group"><label>Hora *</label><input type="time" id="hora" required></div>
                    <div class="form-group"><label>Tu Nombre *</label><input type="text" id="nombre" required></div>
                    <button type="submit" class="btn btn-primary btn-full">Reservar por WhatsApp</button>
                </form>
                <div class="booking-info-premium">
                    <div class="info-card-premium">
                        <h3>Información</h3>
                        <ul>
                            <li>✓ Confirmación vía WhatsApp</li>
                            <li>✓ Llega 5 min antes</li>
                            <li>✓ Cancelación 24h antes</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </section>
