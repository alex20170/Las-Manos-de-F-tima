                <div class="theme-toggle-wrapper">

                </div>
                <ul class="nav-menu">

    <section class="page-header"
        style="background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=1920') center/cover;">
        <div class="container">
            <h1>Reserva tu Cita</h1>
            <p>Tu momento de paz comienza aquí</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="booking-container">
                <form id="bookingForm" class="booking-form-premium">
                    <div class="form-group">
                        <label for="servicio">Selecciona el servicio *</label>
                        <select id="servicio" name="servicio" required>
                            <option value="">-- Elige un servicio --</option>
                            <option value="Masaje Relajante - 45min - 25€">Masaje Relajante (45 min) - 25€</option>
                            <option value="Masaje Terapéutico - 60min - 30€">Masaje Terapéutico (60 min) - 30€</option>
                            <option value="Masaje Deportivo - 60min - 30€">Masaje Deportivo (60 min) - 30€</option>
                            <option value="Masaje Express - 30min - 25€">Masaje Express (30 min) - 25€</option>
                            <option value="Sesión de Reiki - 50min - 30€">Sesión de Reiki (50 min) - 30€</option>
                            <option value="Quiromasaje + Reiki - 90min - 55€">Quiromasaje + Reiki (90 min) - 55€</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group custom-date-group">
                            <label for="fechaDisplay">Fecha preferida *</label>
                            <div class="custom-date-wrapper" id="customDateWrapper">
                                <input type="text" id="fechaDisplay" class="custom-date-input" placeholder="Selecciona una fecha" readonly required>
                                <span class="custom-date-icon">📅</span>
                                <input type="hidden" id="fecha" name="fecha">
                            </div>
                            <!-- Calendario personalizado -->
                            <div class="custom-calendar" id="customCalendar">
                                <div class="cal-header">
                                    <button type="button" class="cal-nav" id="calPrev">&#8249;</button>
                                    <span class="cal-month-year" id="calMonthYear"></span>
                                    <button type="button" class="cal-nav" id="calNext">&#8250;</button>
                                </div>
                                <div class="cal-weekdays">
                                    <span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sa</span><span>Do</span>
                                </div>
                                <div class="cal-days" id="calDays"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="hora">Hora *</label>
                            <select id="hora" name="hora" required>
                                <option value="">-- Selecciona --</option>
                                <option value="09:00">09:00</option>
                                <option value="10:30">10:30</option>
                                <option value="12:00">12:00</option>
                                <option value="16:00">16:00</option>
                                <option value="17:30">17:30</option>
                                <option value="19:00">19:00</option>
                            </select>
                        </div>
                    </div>


                    <div class="form-group">
                        <label for="nombre">Nombre completo *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono *</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="123456789" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-large btn-full">
                        <span class="btn-text">Confirmar y Enviar por WhatsApp</span>
                    </button>
                </form>

                <div class="booking-info-premium">
                    <div class="info-card-premium">
                        <h3>💡 Información</h3>
                        <ul>
                            <li>Confirmación vía WhatsApp</li>
                            <li>Llega 5 min antes</li>
                            <li>Cancelación con 24h de antelación</li>
                        </ul>
                    </div>
                </div>
            </div>

    <footer class="footer-premium">
        <div class="container">
            <p>&copy; 2026 Las Manos de Fátima.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // ===== CALENDARIO PERSONALIZADO =====
        (function() {
            const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            let currentYear, currentMonth, selectedDate = null;

            const cal       = document.getElementById('customCalendar');
            const wrapper   = document.getElementById('customDateWrapper');
            const display   = document.getElementById('fechaDisplay');
            const hidden    = document.getElementById('fecha');
            const calDays   = document.getElementById('calDays');
            const monthYear = document.getElementById('calMonthYear');

            function init() {
                const now = new Date();
                currentYear  = now.getFullYear();
                currentMonth = now.getMonth();
                renderCal();
            }

            function renderCal() {
                monthYear.textContent = MESES[currentMonth] + ' ' + currentYear;
                calDays.innerHTML = '';

                const firstDay = new Date(currentYear, currentMonth, 1).getDay();
                // Lunes=1, Dom=0 → ajustamos para que empiece en Lunes
                const startOffset = (firstDay === 0) ? 6 : firstDay - 1;
                const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
                const today = new Date(); today.setHours(0,0,0,0);

                // Celdas vacías del inicio
                for (let i = 0; i < startOffset; i++) {
                    const blank = document.createElement('span');
                    blank.className = 'cal-day empty';
                    calDays.appendChild(blank);
                }

                for (let d = 1; d <= daysInMonth; d++) {
                    const dayDate = new Date(currentYear, currentMonth, d);
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = d;
                    btn.className = 'cal-day';

                    if (dayDate < today) {
                        btn.classList.add('disabled');
                        btn.disabled = true;
                    } else {
                        btn.addEventListener('click', function() {
                            selectDay(d);
                        });
                    }

                    // Hoy
                    if (dayDate.toDateString() === today.toDateString()) {
                        btn.classList.add('today');
                    }

                    // Seleccionado
                    if (selectedDate &&
                        d === selectedDate.getDate() &&
                        currentMonth === selectedDate.getMonth() &&
                        currentYear === selectedDate.getFullYear()) {
                        btn.classList.add('selected');
                    }

                    calDays.appendChild(btn);
                }
            }

            function selectDay(d) {
                selectedDate = new Date(currentYear, currentMonth, d);
                const dd = String(d).padStart(2,'0');
                const mm = String(currentMonth + 1).padStart(2,'0');
                display.value = dd + '/' + mm + '/' + currentYear;
                hidden.value  = currentYear + '-' + mm + '-' + dd;
                cal.classList.remove('open');
                renderCal();
                
                // Disparar el evento 'change' para que main.js actualice las horas libres
                hidden.dispatchEvent(new Event('change'));
            }

            function pad(n) { return String(n).padStart(2,'0'); }

            // Abrir/cerrar
            wrapper.addEventListener('click', function(e) {
                e.stopPropagation();
                cal.classList.toggle('open');
                if (cal.classList.contains('open')) renderCal();
            });

            // Cerrar al hacer click fuera
            document.addEventListener('click', function() {
                cal.classList.remove('open');
            });
            cal.addEventListener('click', function(e) { e.stopPropagation(); });

            // Navegación mes anterior / siguiente
            document.getElementById('calPrev').addEventListener('click', function() {
                currentMonth--;
                if (currentMonth < 0) { currentMonth = 11; currentYear--; }
                renderCal();
            });
            document.getElementById('calNext').addEventListener('click', function() {
                currentMonth++;
                if (currentMonth > 11) { currentMonth = 0; currentYear++; }
                renderCal();
            });

            init();
        })();
    </script>
</body>


</html>
