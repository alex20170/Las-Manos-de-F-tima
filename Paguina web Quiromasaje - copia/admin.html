<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Las Manos de Fátima</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== LOGIN SCREEN ===== */
        #loginScreen {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #2c3e3a 0%, #4a6741 50%, #7d9d7f 100%);
            display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.12); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.25); border-radius: 28px; padding: 50px 40px;
            width: 100%; max-width: 420px; box-shadow: 0 30px 80px rgba(0,0,0,0.3); text-align: center;
        }
        .login-field { margin-bottom: 16px; text-align: left; }
        .login-field label { display: block; color: rgba(255,255,255,0.85); font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        .login-field input {
            width: 100%; padding: 14px 18px; background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3); border-radius: 14px; color: white; outline: none;
        }
        .login-btn {
            width: 100%; padding: 16px; background: white; color: #2c3e3a; border: none;
            border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer;
        }
        .login-error { color: #ffcdd2; font-size: 0.85rem; margin-top: 12px; display: none; background: rgba(244,67,54,0.2); padding: 10px; border-radius: 10px; }

        /* ===== ADMIN PANEL ===== */
        #adminPanel { display: none; }
        .admin-container { padding: 40px 20px; max-width: 1200px; margin: 80px auto; }
        .admin-card { background: var(--color-bg-light); border-radius: 24px; padding: 35px; box-shadow: var(--shadow-medium); }
        .admin-header { margin-bottom: 30px; border-bottom: 2px solid var(--color-primary-light); padding-bottom: 20px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
        .filter-bar { display: flex; gap: 15px; flex-wrap: wrap; background: rgba(0,0,0,0.03); padding: 15px; border-radius: 15px; margin-bottom: 25px; align-items: center; }
        .filter-group { display: flex; align-items: center; gap: 10px; }
        .filter-group label { font-size: 0.85rem; font-weight: 600; color: var(--color-text-light); }
        .filter-input { padding: 8px 12px; border-radius: 10px; border: 1px solid #ddd; outline: none; font-family: inherit; }
        .btn-filter { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--color-primary); background: transparent; color: var(--color-primary-dark); cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-filter.active { background: var(--color-primary); color: white; }
        .stats-bar { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        .stat-chip { background: white; border: 2px solid var(--color-primary-light); border-radius: 12px; padding: 10px 18px; font-size: 0.85rem; font-weight: 600; }
        .appointments-table { width: 100%; border-collapse: collapse; margin-top: 10px; overflow-x: auto; display: block; }
        .appointments-table th { background: var(--color-primary); color: white; padding: 16px; text-align: left; }
        .appointments-table td { padding: 16px; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 0.9rem; }
        .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .status-pendiente { background: #fff3e0; color: #ef6c00; border: 1px solid #ffe0b2; }
        .status-completada { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .btn-action { width: 36px; height: 36px; border-radius: 10px; border: none; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .btn-complete { background: #e8f5e9; color: #2e7d32; margin-right: 5px; }
        .btn-delete { background: #ffebee; color: #c62828; }
        .source-tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #eee; color: #777; }
        [data-theme="dark"] .admin-card { background: #1e1e1e; border: 1px solid #333; }
        [data-theme="dark"] td { color: #f0f0f0; }
    </style>
</head>
<body>
    <div id="loginScreen">
        <div class="login-card">
            <div class="login-logo">🌿</div>
            <h2>Acceso Administración</h2>
            <form onsubmit="checkLogin(event)">
                <div class="login-field"><label>Usuario</label><input type="text" id="loginUser" required></div>
                <div class="login-field"><label>Contraseña</label><input type="password" id="loginPass" required></div>
                <button type="submit" class="login-btn">Entrar</button>
                <div id="loginError" style="color:#ffcdd2; margin-top:15px; display:none;">❌ Datos incorrectos</div>
            </form>
        </div>
    </div>

    <div id="adminPanel">
        <header id="header">
            <nav class="navbar"><div class="container"><a href="index.html" class="logo"><h1>Panel Admin</h1></a><div style="display:flex; gap: 15px;"><a href="index.html" class="nav-link">🌐 Web</a><button onclick="cerrarSesion()" class="nav-link" style="background:none;border:none;cursor:pointer;color:#c62828;">Salir</button></div></div></nav>
        </header>
        <div class="admin-container">
            <div class="admin-card">
                <div class="admin-header">
                    <div class="header-top"><h2>Gestión de Citas</h2><div style="display:flex; gap:10px;"><button onclick="renderCitas()" class="btn btn-primary">🔄 Actualizar</button><button onclick="exportarExcel()" class="btn btn-primary" style="background:#2e7d32;">📊 Exportar Excel</button></div></div>
                    <div class="filter-bar">
                        <div class="filter-group"><label>📅 Por día:</label><input type="date" id="filterDate" class="filter-input" onchange="renderCitas()"></div>
                        <div class="filter-group">
                            <label>Estado:</label>
                            <button onclick="setFilterStatus('Todos')" class="btn-filter active" id="fAll">Todos</button>
                            <button onclick="setFilterStatus('Pendiente')" class="btn-filter" id="fPend">Pendientes</button>
                            <button onclick="setFilterStatus('Completada')" class="btn-filter" id="fComp">Completadas</button>
                        </div>
                        <button onclick="limpiarFiltros()" style="font-size: 0.8rem; background:none; border:none; color:var(--color-primary-dark); cursor:pointer; text-decoration:underline;">Limpiar filtros</button>
                    </div>
                    <div class="stats-bar" id="statsBar"></div>
                </div>
                <div id="appointmentsList"></div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_USER = 'fatima'; const ADMIN_PASS = 'manos2024';
        const SUPABASE_URL = 'https://hnldgzockufiknivvfaa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhubGRnem9ja3VmaWtuaXZ2ZmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzkzMjIsImV4cCI6MjA5MzY1NTMyMn0.s8X1YX9qfeJXLD6PUVJkKoobgnpf_5A098JZQE7Feqk';
        const _supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
        let currentFilterStatus = 'Todos'; let allCitas = [];

        function checkLogin(e) { e.preventDefault(); if (document.getElementById('loginUser').value === ADMIN_USER && document.getElementById('loginPass').value === ADMIN_PASS) { sessionStorage.setItem('admin_auth', 'true'); document.getElementById('loginScreen').style.display = 'none'; document.getElementById('adminPanel').style.display = 'block'; renderCitas(); } else { document.getElementById('loginError').style.display = 'block'; } }
        function cerrarSesion() { sessionStorage.removeItem('admin_auth'); location.reload(); }
        if (sessionStorage.getItem('admin_auth') === 'true') { document.getElementById('loginScreen').style.display = 'none'; document.getElementById('adminPanel').style.display = 'block'; setTimeout(renderCitas, 100); }

        function setFilterStatus(status) { currentFilterStatus = status; ['fAll', 'fPend', 'fComp'].forEach(id => document.getElementById(id).classList.remove('active')); document.getElementById(status === 'Todos' ? 'fAll' : status === 'Pendiente' ? 'fPend' : 'fComp').classList.add('active'); aplicarFiltros(); }
        function limpiarFiltros() { document.getElementById('filterDate').value = ''; setFilterStatus('Todos'); renderCitas(); }

        async function renderCitas() {
            const listContainer = document.getElementById('appointmentsList');
            listContainer.innerHTML = '<p style="text-align:center; padding:40px;">⏳ Cargando...</p>';
            let cloud = []; let local = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];
            if (_supabase) { try { const { data } = await _supabase.from('citas').select('*'); if (data) cloud = data.map(c => ({ ...c, _source: 'cloud' })); } catch (e) { console.error(e); } }
            allCitas = [...cloud, ...local.map(c => ({ ...c, _source: 'local' }))];
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const listContainer = document.getElementById('appointmentsList');
            const dateFilter = document.getElementById('filterDate').value;
            let filtered = allCitas;
            if (currentFilterStatus !== 'Todos') filtered = filtered.filter(c => c.estado === currentFilterStatus);
            if (dateFilter) filtered = filtered.filter(c => c.fecha === dateFilter);
            filtered.sort((a, b) => (b.fecha + b.hora).localeCompare(a.fecha + a.hora));

            const pend = allCitas.filter(c => c.estado === 'Pendiente').length;
            const comp = allCitas.filter(c => c.estado === 'Completada').length;
            document.getElementById('statsBar').innerHTML = `<span class="stat-chip">📌 Total: ${allCitas.length}</span><span class="stat-chip" style="color:#ef6c00;">⏳ Pendientes: ${pend}</span><span class="stat-chip" style="color:#2e7d32;">✅ Completadas: ${comp}</span>`;

            if (filtered.length === 0) { listContainer.innerHTML = '<p style="text-align:center; padding:40px;">📭 Sin citas.</p>'; return; }
            let html = '<table class="appointments-table"><thead><tr><th>Cliente</th><th>Servicio</th><th>Fecha / Hora</th><th>Estado</th><th>Origen</th><th>Acciones</th></tr></thead><tbody>';
            filtered.forEach(cita => {
                const pk = Object.keys(cita).find(k => k === 'id' || k === 'created_at' || k === 'nombre');
                const id = JSON.stringify(cita[pk]);
                html += `<tr><td><strong>${cita.nombre}</strong></td><td>${cita.servicio}</td><td>${cita.fecha} ${cita.hora}</td><td><span class="status-badge status-${cita.estado.toLowerCase()}">${cita.estado}</span></td><td><span class="source-tag">${cita._source === 'cloud' ? '☁️' : '💾'}</span></td><td>${cita.estado === 'Pendiente' ? `<button onclick="cambiarEstado(${id}, 'Completada', '${cita._source}')" class="btn-action btn-complete">✓</button>` : ''}<button onclick="borrarCita(${id}, '${cita._source}')" class="btn-action btn-delete">🗑️</button></td></tr>`;
            });
            listContainer.innerHTML = html + '</tbody></table>';
        }

        async function cambiarEstado(id, estado, source) {
            if (source === 'cloud' && _supabase) {
                const { data } = await _supabase.from('citas').select('*').limit(1);
                const pk = data && data[0] ? Object.keys(data[0]).find(k => k === 'id' || k === 'created_at' || k === 'nombre') : 'id';
                await _supabase.from('citas').update({ estado }).eq(pk, id);
            } else {
                let items = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];
                items = items.map(c => (c.id == id || c.nombre == id || c.created_at == id) ? { ...c, estado } : c);
                localStorage.setItem('citas_manos_fatima', JSON.stringify(items));
            }
            renderCitas();
        }

        async function borrarCita(id, source) {
            if (!confirm('¿Borrar?')) return;
            if (source === 'cloud' && _supabase) {
                const { data } = await _supabase.from('citas').select('*').limit(1);
                const pk = data && data[0] ? Object.keys(data[0]).find(k => k === 'id' || k === 'created_at' || k === 'nombre') : 'id';
                await _supabase.from('citas').delete().eq(pk, id);
            } else {
                let items = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];
                items = items.filter(c => (c.id != id && c.nombre != id && c.created_at != id));
                localStorage.setItem('citas_manos_fatima', JSON.stringify(items));
            }
            renderCitas();
        }

        function exportarExcel() {
            let csv = 'Cliente;Servicio;Fecha;Hora;Estado;Origen\n';
            allCitas.forEach(c => csv += `${c.nombre};${c.servicio};${c.fecha};${c.hora};${c.estado};${c._source}\n`);
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob); const a = document.createElement('a');
            const now = new Date(); const dateStr = now.getFullYear() + '-' + (now.getMonth()+1) + '-' + now.getDate();
            a.href = url; a.download = 'citas_manos_fatima_' + dateStr + '.csv'; a.click();
        }
    </script>
</body>
</html>
