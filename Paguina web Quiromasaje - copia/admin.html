<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Las Manos de Fátima</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== LOGIN SCREEN ===== */
        #loginScreen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #2c3e3a 0%, #4a6741 50%, #7d9d7f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 28px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            text-align: center;
            animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes slideUp {
            from { opacity:0; transform: translateY(30px); }
            to   { opacity:1; transform: translateY(0); }
        }
        .login-logo { font-size: 3rem; margin-bottom: 10px; }
        .login-card h2 { color: white; font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 5px; }
        .login-card p { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 30px; }
        .login-field { margin-bottom: 16px; text-align: left; }
        .login-field label { display: block; color: rgba(255,255,255,0.85); font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.5px; }
        .login-field input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }
        .login-btn {
            width: 100%;
            padding: 16px;
            background: white;
            color: #2c3e3a;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .login-error { color: #ffcdd2; font-size: 0.85rem; margin-top: 12px; display: none; background: rgba(244,67,54,0.2); padding: 10px; border-radius: 10px; }

        /* ===== ADMIN PANEL ===== */
        #adminPanel { display: none; }
        .admin-container { padding: 40px 20px; max-width: 1100px; margin: 80px auto; }
        .admin-card { background: var(--color-bg-light); border-radius: 20px; padding: 30px; box-shadow: var(--shadow-medium); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--color-primary-light); padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .admin-actions { display: flex; gap: 10px; }
        .appointments-table { width: 100%; border-collapse: collapse; margin-top: 20px; overflow-x: auto; display: block; }
        .appointments-table th { background: var(--color-primary); color: white; padding: 14px 15px; text-align: left; font-weight: 600; }
        .appointments-table td { padding: 14px 15px; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 0.9rem; }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .status-pendiente { background: #fff3e0; color: #ef6c00; }
        .status-completada { background: #e8f5e9; color: #2e7d32; }
        .btn-delete { background: #ffebee; color: #c62828; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .btn-complete { background: #e8f5e9; color: #2e7d32; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; margin-right: 5px; }
        .stat-chip { background: white; border: 2px solid var(--color-primary-light); border-radius: 12px; padding: 10px 20px; font-size: 0.85rem; font-weight: 600; margin-right: 10px; }
        .source-tag { font-size: 0.7rem; color: #999; }
        [data-theme="dark"] .admin-card { background: #1e1e1e; border: 1px solid #333; }
        [data-theme="dark"] td { color: #f0f0f0; }
    </style>
</head>
<body>

    <!-- ===== PANTALLA DE LOGIN ===== -->
    <div id="loginScreen">
        <div class="login-card">
            <div class="login-logo">🌿</div>
            <h2>Panel de Administración</h2>
            <p>Las Manos de Fátima — Acceso privado</p>
            <form id="loginForm" onsubmit="checkLogin(event)">
                <div class="login-field">
                    <label>👤 Usuario</label>
                    <input type="text" id="loginUser" required>
                </div>
                <div class="login-field">
                    <label>🔒 Contraseña</label>
                    <input type="password" id="loginPass" required>
                </div>
                <button type="submit" class="login-btn">Entrar al Panel →</button>
                <div id="loginError" class="login-error">❌ Credenciales incorrectas</div>
            </form>
        </div>
    </div>

    <!-- ===== PANEL DE ADMIN ===== -->
    <div id="adminPanel">
        <header id="header">
            <nav class="navbar">
                <div class="container">
                    <a href="index.html" class="logo"><div class="logo-text"><h1>Panel Admin</h1></div></a>
                    <div style="display:flex; gap: 15px;">
                        <a href="index.html" class="nav-link">🌐 Web</a>
                        <button onclick="cerrarSesion()" class="nav-link" style="background:none;border:none;cursor:pointer;color:#c62828;">🚪 Salir</button>
                    </div>
                </div>
            </nav>
        </header>

        <div class="admin-container">
            <div class="admin-card">
                <div class="admin-header">
                    <div>
                        <h2>📋 Gestión de Citas</h2>
                        <div id="statsBar" style="margin-top:12px; display:flex;"></div>
                    </div>
                    <div class="admin-actions">
                        <button onclick="renderCitas()" class="btn btn-primary">🔄</button>
                        <button onclick="exportarCitas()" class="btn btn-primary" style="background:#2e7d32;">📥</button>
                    </div>
                </div>
                <div id="appointmentsList"></div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_USER = 'fatima';
        const ADMIN_PASS = 'manos2024';
        const SUPABASE_URL = 'https://hnldgzockufiknivvfaa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhubGRnem9ja3VmaWtuaXZ2ZmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzkzMjIsImV4cCI6MjA5MzY1NTMyMn0.s8X1YX9qfeJXLD6PUVJkKoobgnpf_5A098JZQE7Feqk';
        const _supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        function checkLogin(e) {
            e.preventDefault();
            if (document.getElementById('loginUser').value === ADMIN_USER && document.getElementById('loginPass').value === ADMIN_PASS) {
                sessionStorage.setItem('admin_auth', 'true');
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                renderCitas();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function cerrarSesion() {
            sessionStorage.removeItem('admin_auth');
            location.reload();
        }

        if (sessionStorage.getItem('admin_auth') === 'true') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            setTimeout(renderCitas, 100);
        }

        async function renderCitas() {
            const listContainer = document.getElementById('appointmentsList');
            listContainer.innerHTML = '<p>Cargando...</p>';
            let cloud = [];
            let local = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];

            if (_supabase) {
                const { data } = await _supabase.from('citas').select('*');
                if (data) cloud = data.map(c => ({ ...c, _source: 'cloud' }));
            }

            const total = [...cloud, ...local.map(c => ({ ...c, _source: 'local' }))];
            
            document.getElementById('statsBar').innerHTML = `<span class="stat-chip">Total: ${total.length}</span>`;

            if (total.length === 0) {
                listContainer.innerHTML = '<p>No hay citas.</p>';
                return;
            }

            let html = '<table class="appointments-table"><thead><tr><th>Cliente</th><th>Servicio</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>';
            total.forEach(cita => {
                const pk = Object.keys(cita)[0];
                const id = cita[pk];
                html += `<tr>
                    <td>${cita.nombre}</td>
                    <td>${cita.servicio}</td>
                    <td>${cita.fecha} ${cita.hora}</td>
                    <td><span class="status-badge status-${cita.estado.toLowerCase()}">${cita.estado}</span></td>
                    <td>
                        <button onclick="cambiarEstado('${id}', 'Completada', '${cita._source}')" class="btn-complete">✓</button>
                        <button onclick="borrarCita('${id}', '${cita._source}')" class="btn-delete">🗑️</button>
                    </td>
                </tr>`;
            });
            listContainer.innerHTML = html + '</tbody></table>';
        }

        async function cambiarEstado(id, estado, source) {
            if (source === 'cloud' && _supabase) {
                const { data } = await _supabase.from('citas').select('*').limit(1);
                const pk = data ? Object.keys(data[0])[0] : 'id';
                await _supabase.from('citas').update({ estado }).eq(pk, id);
            } else {
                let items = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];
                items = items.map(c => c.id == id ? { ...c, estado } : c);
                localStorage.setItem('citas_manos_fatima', JSON.stringify(items));
            }
            renderCitas();
        }

        async function borrarCita(id, source) {
            if (!confirm('¿Borrar?')) return;
            if (source === 'cloud' && _supabase) {
                const { data } = await _supabase.from('citas').select('*').limit(1);
                const pk = data ? Object.keys(data[0])[0] : 'id';
                await _supabase.from('citas').delete().eq(pk, id);
            } else {
                let items = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];
                items = items.filter(c => c.id != id);
                localStorage.setItem('citas_manos_fatima', JSON.stringify(items));
            }
            renderCitas();
        }

        function exportarCitas() {
            const data = localStorage.getItem('citas_manos_fatima');
            const blob = new Blob([data], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'citas.json';
            a.click();
        }
    </script>
</body>
</html>
