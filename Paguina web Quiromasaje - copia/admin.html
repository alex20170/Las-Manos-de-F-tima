<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Las Manos de Fátima</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-container { padding: 40px 20px; max-width: 1000px; margin: 80px auto; }
        .admin-card { background: var(--color-bg-light); border-radius: 20px; padding: 30px; box-shadow: var(--shadow-medium); }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--color-primary-light); padding-bottom: 15px; }
        .appointments-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .appointments-table th, .appointments-table td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .status-pendiente { background: #fff3e0; color: #ef6c00; }
        .status-completada { background: #e8f5e9; color: #2e7d32; }
        .btn-delete { background: #ffebee; color: #c62828; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .btn-complete { background: #e8f5e9; color: #2e7d32; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; margin-right: 5px; }
        .empty-state { text-align: center; padding: 50px; color: var(--color-text-light); }
        [data-theme="dark"] .admin-card { background: #1e1e1e; border: 1px solid #333; }
        [data-theme="dark"] td { color: #f0f0f0; }
    </style>
</head>
<body>
    <header id="header">
        <nav class="navbar">
            <div class="container">
                <a href="index.html" class="logo">
                    <div class="logo-text"><h1>Panel Admin</h1></div>
                </a>
                <a href="index.html" class="nav-link">Volver a la web</a>
            </div>
        </nav>
    </header>

    <div class="admin-container">
        <div class="admin-card">
            <div class="admin-header">
                <h2>Gestión de Citas</h2>
                <button onclick="exportarCitas()" class="btn btn-primary" style="padding: 8px 15px; font-size: 0.8rem;">Exportar Excel</button>
            </div>
            
            <div id="appointmentsList">
                <!-- Las citas se cargarán aquí -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hnldgzockufiknivvfaa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhubGRnem9ja3VmaWtuaXZ2ZmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzkzMjIsImV4cCI6MjA5MzY1NTMyMn0.s8X1YX9qfeJXLD6PUVJkKoobgnpf_5A098JZQE7Feqk';
        const _supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        async function renderCitas() {
            const listContainer = document.getElementById('appointmentsList');
            let citasCloud = [];
            let citasLocal = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];

            // 1. Intentar traer de la nube
            if (_supabase) {
                try {
                    const { data, error } = await _supabase.from('citas').select('*').order('id', { ascending: false });
                    if (!error && data) citasCloud = data;
                } catch (e) {
                    console.error("Error leyendo de Supabase:", e);
                }
            }

            // 2. Combinar ambas (evitando duplicados por ID si fuera necesario, 
            // pero aquí las locales suelen ser las que no subieron)
            const citas = [...citasCloud, ...citasLocal];

            if (citas.length === 0) {
                listContainer.innerHTML = '<div class="empty-state"><h3>No hay citas registradas todavía</h3><p>Las nuevas reservas aparecerán aquí automáticamente.</p></div>';
                return;
            }

            let html = `
                <table class="appointments-table">
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Servicio</th>
                            <th>Fecha/Hora</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            citas.forEach(cita => {
                html += `
                    <tr>
                        <td><strong>${cita.nombre}</strong></td>
                        <td>${cita.servicio ? cita.servicio.split('-')[0] : 'N/A'}</td>
                        <td>${cita.fecha} a las ${cita.hora}</td>
                        <td><span class="status-badge status-${cita.estado.toLowerCase()}">${cita.estado}</span></td>
                        <td>
                            ${cita.estado === 'Pendiente' ? `<button onclick="cambiarEstado(${cita.id}, 'Completada')" class="btn-complete">✓</button>` : ''}
                            <button onclick="borrarCita(${cita.id})" class="btn-delete">🗑️</button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            listContainer.innerHTML = html;
        }

        async function cambiarEstado(id, nuevoEstado) {
            if (_supabase) {
                await _supabase.from('citas').update({ estado: nuevoEstado }).eq('id', id);
            } else {
                let citas = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];
                citas = citas.map(c => c.id === id ? {...c, estado: nuevoEstado} : c);
                localStorage.setItem('citas_manos_fatima', JSON.stringify(citas));
            }
            renderCitas();
        }

        async function borrarCita(id) {
            if (confirm('¿Seguro que quieres eliminar este registro?')) {
                if (_supabase) {
                    await _supabase.from('citas').delete().eq('id', id);
                } else {
                    let citas = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];
                    citas = citas.filter(c => c.id !== id);
                    localStorage.setItem('citas_manos_fatima', JSON.stringify(citas));
                }
                renderCitas();
            }
        }

        function exportarCitas() {
            const citas = localStorage.getItem('citas_manos_fatima');
            const blob = new Blob([citas], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'citas_manos_fatima.json';
            a.click();
        }

        // Cargar citas al iniciar
        renderCitas();
    </script>
</body>
</html>
