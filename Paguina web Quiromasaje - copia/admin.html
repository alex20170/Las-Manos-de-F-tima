<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Las Manos de Fátima</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #loginScreen { position: fixed; inset: 0; background: #2c3e3a; display: flex; align-items: center; justify-content: center; z-index: 9999; color: white; font-family: sans-serif; }
        .login-card { background: rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        input { padding: 10px; margin: 10px 0; border-radius: 5px; border: none; width: 100%; }
        button { cursor: pointer; padding: 10px 20px; border-radius: 5px; border: none; font-weight: bold; }
        #adminPanel { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; font-family: sans-serif; }
        .stats { display: flex; gap: 10px; margin: 20px 0; }
        .chip { padding: 10px; border-radius: 10px; background: #f0f0f0; font-weight: bold; }
        .filters { background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th { background: #7d9d7f; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .btn-v { background: #e8f5e9; color: #2e7d32; }
        .btn-x { background: #ffebee; color: #c62828; }
        .active-filter { background: #7d9d7f !important; color: white !important; }
    </style>
</head>
<body style="background: #f4f7f6;">

    <div id="loginScreen">
        <div class="login-card">
            <h2>Acceso Admin</h2>
            <input type="text" id="u" placeholder="Usuario">
            <input type="password" id="p" placeholder="Contraseña">
            <button onclick="login()" style="background: white; color: #2c3e3a;">Entrar</button>
        </div>
    </div>

    <div id="adminPanel">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h1>Las Manos de Fátima</h1>
            <button onclick="logout()" style="background: #c62828; color: white;">Salir</button>
        </div>

        <div class="filters">
            <span>📅</span> <input type="date" id="fDate" onchange="apply()" style="width: auto;">
            <button onclick="setStatus('Todos')" id="bAll" class="active-filter">Todos</button>
            <button onclick="setStatus('Pendiente')" id="bPen">Pendientes</button>
            <button onclick="setStatus('Completada')" id="bCom">Completadas</button>
            <button onclick="clearF()" style="background:none; text-decoration: underline;">Limpiar</button>
            <button onclick="exportCSV()" style="background: #2e7d32; color: white; margin-left: auto;">Exportar Excel</button>
        </div>

        <div class="stats" id="st"></div>
        <div id="list"></div>
    </div>

    <script>
        const U = 'fatima'; const P = 'manos2024';
        const S_URL = 'https://hnldgzockufiknivvfaa.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhubGRnem9ja3VmaWtuaXZ2ZmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzkzMjIsImV4cCI6MjA5MzY1NTMyMn0.s8X1YX9qfeJXLD6PUVJkKoobgnpf_5A098JZQE7Feqk';
        const sup = window.supabase ? window.supabase.createClient(S_URL, S_KEY) : null;
        
        let all = []; let fStatus = 'Todos';

        function login() {
            if(document.getElementById('u').value===U && document.getElementById('p').value===P) {
                sessionStorage.setItem('auth', '1');
                start();
            } else alert('Error');
        }
        function logout() { sessionStorage.clear(); location.reload(); }
        function start() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            load();
        }
        if(sessionStorage.getItem('auth')) start();

        async function load() {
            document.getElementById('list').innerHTML = 'Cargando...';
            let cloud = [];
            let local = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];
            if(sup) {
                const { data } = await sup.from('citas').select('*');
                if(data) cloud = data.map(c => ({...c, _s: 'cloud'}));
            }
            all = [...cloud, ...local.map(c => ({...c, _s: 'local'}))];
            apply();
        }

        function setStatus(s) {
            fStatus = s;
            ['bAll','bPen','bCom'].forEach(b => document.getElementById(b).classList.remove('active-filter'));
            if(s==='Todos') document.getElementById('bAll').classList.add('active-filter');
            if(s==='Pendiente') document.getElementById('bPen').classList.add('active-filter');
            if(s==='Completada') document.getElementById('bCom').classList.add('active-filter');
            apply();
        }

        function clearF() {
            document.getElementById('fDate').value = '';
            setStatus('Todos');
        }

        function apply() {
            const date = document.getElementById('fDate').value;
            let filtered = all;
            if(fStatus !== 'Todos') filtered = filtered.filter(c => c.estado === fStatus);
            if(date) filtered = filtered.filter(c => c.fecha === date);

            // Stats
            const p = all.filter(c => c.estado === 'Pendiente').length;
            const c = all.filter(c => c.estado === 'Completada').length;
            document.getElementById('st').innerHTML = `<div class="chip">Total: ${all.length}</div><div class="chip" style="color:orange">Pendientes: ${p}</div><div class="chip" style="color:green">Completadas: ${c}</div>`;

            if(filtered.length === 0) {
                document.getElementById('list').innerHTML = '<p>No hay citas.</p>';
                return;
            }

            let h = '<table><tr><th>Cliente</th><th>Servicio</th><th>Fecha/Hora</th><th>Estado</th><th>Acciones</th></tr>';
            filtered.forEach(item => {
                // Buscamos el ID real
                const id = item.id || item.created_at || item.nombre;
                const idEsc = JSON.stringify(id);
                h += `<tr>
                    <td><b>${item.nombre}</b></td>
                    <td>${item.servicio}</td>
                    <td>${item.fecha} ${item.hora}</td>
                    <td>${item.estado}</td>
                    <td>
                        <button onclick="upd(${idEsc},'Completada','${item._s}')" class="btn-v">✓</button>
                        <button onclick="del(${idEsc},'${item._s}')" class="btn-x">🗑️</button>
                    </td>
                </tr>`;
            });
            document.getElementById('list').innerHTML = h + '</table>';
        }

        async function upd(id, st, src) {
            if(src==='cloud') {
                // Buscamos columna PK
                const { data } = await sup.from('citas').select('*').limit(1);
                const pk = data && data[0] ? Object.keys(data[0])[0] : 'id';
                await sup.from('citas').update({ estado: st }).eq(pk, id);
            } else {
                let items = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];
                items = items.map(c => (c.id == id || c.created_at == id || c.nombre == id) ? {...c, estado: st} : c);
                localStorage.setItem('citas_manos_fatima', JSON.stringify(items));
            }
            load();
        }

        async function del(id, src) {
            if(!confirm('¿Borrar?')) return;
            if(src==='cloud') {
                const { data } = await sup.from('citas').select('*').limit(1);
                const pk = data && data[0] ? Object.keys(data[0])[0] : 'id';
                await sup.from('citas').delete().eq(pk, id);
            } else {
                let items = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];
                items = items.filter(c => (c.id != id && c.created_at != id && c.nombre != id));
                localStorage.setItem('citas_manos_fatima', JSON.stringify(items));
            }
            load();
        }

        function exportCSV() {
            let csv = 'Cliente;Servicio;Fecha;Hora;Estado\n';
            all.forEach(c => csv += `${c.nombre};${c.servicio};${c.fecha};${c.hora};${c.estado}\n`);
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'citas.csv';
            a.click();
        }
    </script>
</body>
</html>
