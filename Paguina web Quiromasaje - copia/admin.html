<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Las Manos de Fátima</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== LOGIN SCREEN PREMIUM ===== */
        #loginScreen {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #2c3e3a 0%, #4a6741 50%, #7d9d7f 100%);
            display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.12); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.25); border-radius: 28px; padding: 50px 40px;
            width: 100%; max-width: 420px; box-shadow: 0 30px 80px rgba(0,0,0,0.3); text-align: center;
        }
        .login-logo { font-size: 3.5rem; margin-bottom: 10px; }
        .login-card h2 { color: white; font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 5px; }
        .login-card p { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 30px; }
        .login-field { margin-bottom: 16px; text-align: left; }
        .login-field label { display: block; color: rgba(255,255,255,0.85); font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        .login-field input {
            width: 100%; padding: 14px 18px; background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3); border-radius: 14px; color: white; outline: none; transition: 0.3s;
        }
        .login-btn {
            width: 100%; padding: 16px; background: white; color: #2c3e3a; border: none;
            border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .login-error { color: #ffcdd2; font-size: 0.85rem; margin-top: 15px; background: rgba(244,67,54,0.2); padding: 10px; border-radius: 10px; display: none; }

        /* ===== ADMIN PANEL PREMIUM ===== */
        #adminPanel { display: none; }
        .admin-container { padding: 40px 20px; max-width: 1200px; margin: 80px auto; }
        .admin-card { background: var(--color-bg-light); border-radius: 24px; padding: 35px; box-shadow: var(--shadow-medium); }
        .admin-header { margin-bottom: 30px; border-bottom: 2px solid var(--color-primary-light); padding-bottom: 20px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
        
        .filter-bar { display: flex; gap: 15px; flex-wrap: wrap; background: rgba(0,0,0,0.03); padding: 15px; border-radius: 15px; margin-bottom: 25px; align-items: center; }
        .filter-group { display: flex; align-items: center; gap: 10px; }
        .filter-input { padding: 8px 12px; border-radius: 10px; border: 1px solid #ddd; outline: none; }
        .btn-filter { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--color-primary); background: transparent; color: var(--color-primary-dark); cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-filter.active { background: var(--color-primary); color: white; }

        .stats-bar { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        .stat-chip { background: white; border: 2px solid var(--color-primary-light); border-radius: 12px; padding: 10px 18px; font-size: 0.85rem; font-weight: 600; }
        
        .appointments-table { width: 100%; border-collapse: collapse; margin-top: 10px; overflow-x: auto; display: block; }
        .appointments-table th { background: var(--color-primary); color: white; padding: 16px; text-align: left; }
        .appointments-table td { padding: 16px; border-bottom: 1px solid rgba(0,0,0,0.06); font-size: 0.9rem; }
        .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .status-pendiente { background: #fff3e0; color: #ef6c00; }
        .status-completada { background: #e8f5e9; color: #2e7d32; }
        
        .btn-action { width: 36px; height: 36px; border-radius: 10px; border: none; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .btn-complete { background: #e8f5e9; color: #2e7d32; margin-right: 5px; }
        .btn-delete { background: #ffebee; color: #c62828; }
        
        [data-theme="dark"] .admin-card { background: #1e1e1e; border: 1px solid #333; }
        [data-theme="dark"] .stat-chip { background: #2a2a2a; }
        [data-theme="dark"] td { color: #f0f0f0; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-card">
            <div class="login-logo">🌿</div>
            <h2>Acceso Administración</h2>
            <p>Las Manos de Fátima</p>
            <form onsubmit="checkLogin(event)">
                <div class="login-field"><label>Usuario</label><input type="text" id="loginUser" required></div>
                <div class="login-field"><label>Contraseña</label><input type="password" id="loginPass" required></div>
                <button type="submit" class="login-btn">Entrar</button>
                <div id="loginError" class="login-error">❌ Datos incorrectos</div>
            </form>
        </div>
    </div>

    <div id="adminPanel">
        <header id="header">
            <nav class="navbar"><div class="container"><a href="index.html" class="logo"><h1>Panel Admin</h1></a><div style="display:flex; gap: 15px;"><a href="index.html" class="nav-link">🌐 Web</a><button onclick="cerrarSesion()" class="nav-link" style="background:none;border:none;cursor:pointer;color:#c62828;">Salir</button></div></div></nav>
        </header>

        <div class="admin-container">
            <div class="admin-card">
                <div class="admin-header">
                    <div class="header-top">
                        <h2>Gestión de Citas</h2>
                        <div style="display:flex; gap:10px;">
                            <button onclick="renderCitas()" class="btn btn-primary">🔄 Actualizar</button>
                            <button onclick="exportarExcel()" class="btn btn-primary" style="background:#2e7d32;">📊 Exportar Excel</button>
                        </div>
                    </div>
                    
                    <div class="filter-bar">
                        <div class="filter-group"><label>📅 Por día:</label><input type="date" id="filterDate" class="filter-input" onchange="renderCitas()"></div>
                        <div class="filter-group">
                            <label>Estado:</label>
                            <button onclick="setFilterStatus('Todos')" class="btn-filter active" id="fAll">Todos</button>
                            <button onclick="setFilterStatus('Pendiente')" class="btn-filter" id="fPend">Pendientes</button>
                            <button onclick="setFilterStatus('Completada')" class="btn-filter" id="fComp">Completadas</button>
                        </div>
                    </div>

                    <div class="stats-bar" id="statsBar"></div>
                </div>
                <div id="appointmentsList"></div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_USER = 'admin'; const ADMIN_PASS = 'admin-1234';
        const S_URL = 'https://hnldgzockufiknivvfaa.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhubGRnem9ja3VmaWtuaXZ2ZmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzkzMjIsImV4cCI6MjA5MzY1NTMyMn0.s8X1YX9qfeJXLD6PUVJkKoobgnpf_5A098JZQE7Feqk';
        const sup = window.supabase ? window.supabase.createClient(S_URL, S_KEY) : null;
        
        let allCitas = []; let filterStatus = 'Todos';

        function checkLogin(e) {
            e.preventDefault();
            if(document.getElementById('loginUser').value===ADMIN_USER && document.getElementById('loginPass').value===ADMIN_PASS) {
                sessionStorage.setItem('auth', '1');
                startPanel();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }
        function cerrarSesion() { sessionStorage.clear(); location.reload(); }
        function startPanel() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            renderCitas();
        }
        if(sessionStorage.getItem('auth')) startPanel();

        function setFilterStatus(s) {
            filterStatus = s;
            ['fAll','fPend','fComp'].forEach(b => document.getElementById(b).classList.remove('active'));
            document.getElementById(s==='Todos'?'fAll':s==='Pendiente'?'fPend':'fComp').classList.add('active');
            aplicarFiltros();
        }
        function limpiarFiltros() { document.getElementById('filterDate').value = ''; setFilterStatus('Todos'); renderCitas(); }

        async function renderCitas() {
            const list = document.getElementById('appointmentsList');
            list.innerHTML = '<p style="text-align:center; padding:40px;">⏳ Cargando citas...</p>';
            let cloud = [];
            let local = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];
            if(sup) {
                const { data } = await sup.from('citas').select('*');
                if(data) cloud = data.map(c => ({...c, _src: 'cloud'}));
            }
            allCitas = [...cloud, ...local.map(c => ({...c, _src: 'local'}))];
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const list = document.getElementById('appointmentsList');
            const dateVal = document.getElementById('filterDate').value;
            const now = new Date();
            let filtered = allCitas;
            
            if(filterStatus !== 'Todos') filtered = filtered.filter(c => c.estado === filterStatus);
            if(dateVal) filtered = filtered.filter(c => c.fecha === dateVal);
            
            // Ordenar: Más recientes arriba (descendente por fecha y hora)
            filtered.sort((a,b) => (b.fecha + ' ' + b.hora).localeCompare(a.fecha + ' ' + a.hora));

            const p = allCitas.filter(c => c.estado === 'Pendiente').length;
            const c = allCitas.filter(c => c.estado === 'Completada').length;
            document.getElementById('statsBar').innerHTML = `<span class="stat-chip">📌 Total: ${allCitas.length}</span><span class="stat-chip" style="color:#ef6c00;">⏳ Pendientes: ${p}</span><span class="stat-chip" style="color:#2e7d32;">✅ Completadas: ${c}</span>`;

            if(filtered.length === 0) { list.innerHTML = '<p style="text-align:center; padding:40px;">No hay citas.</p>'; return; }
            
            let h = '<table class="appointments-table"><thead><tr><th>Cliente</th><th>Servicio</th><th>Fecha / Hora</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>';
            
            filtered.forEach(item => {
                const pk = item.id ? 'id' : (item.created_at ? 'created_at' : 'nombre');
                const idVal = JSON.stringify(item[pk]).replace(/"/g, '&quot;');
                const pkName = JSON.stringify(pk).replace(/"/g, '&quot;');
                
                // Comprobar si la cita ha pasado (y sigue pendiente)
                const appDate = new Date(item.fecha + 'T' + item.hora);
                const isPast = appDate < now && item.estado === 'Pendiente';
                const rowStyle = isPast ? 'style="background: #fff5f5; color: #c62828;"' : '';
                
                h += `<tr ${rowStyle}>
                    <td><strong>${item.nombre}</strong></td>
                    <td>${item.servicio}</td>
                    <td style="${isPast ? 'font-weight: bold;' : ''}">${item.fecha} ${item.hora} ${isPast ? '⚠️' : ''}</td>
                    <td><span class="status-badge status-${item.estado.toLowerCase()}">${item.estado}</span></td>
                    <td>
                        ${item.estado==='Pendiente'?`<button onclick="cambiarEstado(${idVal},'Completada','${item._src}',${pkName})" class="btn-action btn-complete">✓</button>`:''}
                        <button onclick="borrarCita(${idVal},'${item._src}',${pkName})" class="btn-action btn-delete">🗑️</button>
                    </td>
                </tr>`;
            });
            list.innerHTML = h + '</tbody></table>';
        }

        async function cambiarEstado(id, st, src, pk) {
            if(src==='cloud' && sup) {
                await sup.from('citas').update({ estado: st }).eq(pk, id);
            } else {
                let items = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];
                items = items.map(c => (c[pk]==id)?{...c, estado: st}:c);
                localStorage.setItem('citas_manos_fatima', JSON.stringify(items));
            }
            renderCitas();
        }

        async function borrarCita(id, src, pk) {
            if(!confirm('¿Borrar cita?')) return;
            if(src==='cloud' && sup) {
                await sup.from('citas').delete().eq(pk, id);
            } else {
                let items = JSON.parse(localStorage.getItem('citas_manos_fatima')) || [];
                items = items.filter(c => c[pk]!=id);
                localStorage.setItem('citas_manos_fatima', JSON.stringify(items));
            }
            renderCitas();
        }

        function exportarExcel() {
            let csv = 'Cliente;Servicio;Fecha;Hora;Estado\n';
            allCitas.forEach(c => csv += `${c.nombre};${c.servicio};${c.fecha};${c.hora};${c.estado}\n`);
            const blob = new Blob(["\ufeff"+csv], { type: 'text/csv;charset=utf-8;' });
            const now = new Date(); const dateStr = now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate();
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'citas_fatima_'+dateStr+'.csv'; a.click();
        }
    </script>
</body>
</html>
