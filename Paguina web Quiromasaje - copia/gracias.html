<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias! | Las Manos de Fátima</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .thanks-container {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .success-checkmark {
            font-size: 5rem;
            color: var(--color-primary);
            margin-bottom: 20px;
            animation: scaleIn 0.5s ease-out;
        }
        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
    </style>
</head>
<body>
    <header id="header">
        <nav class="navbar">
            <div class="container">
                <a href="index.html" class="logo">
                    <div class="logo-text">
                        <h1>Las Manos de Fátima</h1>
                    </div>
                </a>
                <div class="theme-toggle-wrapper">
                    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
                        <span class="theme-icon">🌙</span>
                    </button>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">Inicio</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="container thanks-container">
        <div class="success-checkmark">✓</div>
        <h1 class="section-title">¡Reserva Enviada!</h1>
        <p class="section-subtitle">Hemos abierto WhatsApp para que confirmes los detalles. Fátima te responderá lo antes posible.</p>
        <div style="margin-top: 40px;">
            <a href="index.html" class="btn btn-primary">Volver al Inicio</a>
        </div>
    </div>

    <footer class="footer-premium">
        <div class="container">
            <p>&copy; 2026 Las Manos de Fátima.</p>
        </div>
    </footer>
</body>
</html>
